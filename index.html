<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmission</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            background: #1c1c1e;
        }

        #header {
            background: #2c2c2e;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #38383a;
        }

        #avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        #contact-info {
            flex: 1;
        }

        #contact-name {
            font-size: 16px;
            font-weight: 600;
        }

        #contact-status {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 2px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34c759;
            margin-right: 4px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.received {
            justify-content: flex-start;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 20px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.received .message-bubble {
            background: #2c2c2e;
            border-bottom-left-radius: 4px;
        }

        .message.sent .message-bubble {
            background: #0a84ff;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: #8e8e93;
            margin-top: 4px;
            text-align: right;
        }

        .message.received .message-time {
            text-align: left;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: #2c2c2e;
            border-radius: 20px;
            width: 60px;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8e8e93;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        #choices {
            padding: 12px 16px;
            background: #2c2c2e;
            border-top: 1px solid #38383a;
            display: none;
            flex-direction: column;
            gap: 8px;
            max-height: 40vh;
            overflow-y: auto;
        }

        #choices.active {
            display: flex;
        }

        .choice-button {
            background: #3a3a3c;
            border: 1px solid #48484a;
            color: #fff;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-button:hover {
            background: #48484a;
            transform: scale(1.02);
        }

        .choice-button:active {
            transform: scale(0.98);
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            z-index: 1000;
        }

        #start-screen.hidden {
            display: none;
        }

        .title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 18px;
            color: #8e8e93;
            text-align: center;
            margin-bottom: 48px;
            line-height: 1.6;
        }

        .start-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            padding: 16px 48px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .start-button:hover {
            transform: scale(1.05);
        }

        .start-button:active {
            transform: scale(0.95);
        }

        #menu-button {
            background: none;
            border: none;
            color: #0a84ff;
            font-size: 16px;
            cursor: pointer;
            padding: 8px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2c2c2e;
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .modal-button {
            background: #3a3a3c;
            border: 1px solid #48484a;
            color: #fff;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .modal-button:hover {
            background: #48484a;
        }

        .modal-button.danger {
            color: #ff453a;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <div class="title">📡 TRANSMISSION</div>
        <div class="subtitle">
            Une catastrophe mondiale a coupé toutes les communications.<br>
            Votre fils Léo, 11 ans, est seul en France.<br>
            Vous êtes bloqué à l'étranger.<br><br>
            Votre téléphone satellite s'allume...
        </div>
        <button class="start-button" onclick="startGame()">COMMENCER</button>
    </div>

    <div id="game-container">
        <div id="header">
            <div id="avatar">👦</div>
            <div id="contact-info">
                <div id="contact-name">Léo</div>
                <div id="contact-status">
                    <span class="status-indicator"></span>Satellite connecté
                </div>
            </div>
            <button id="menu-button" onclick="openMenu()">☰</button>
        </div>

        <div id="messages">
            <div class="typing-indicator" id="typing">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <div id="choices"></div>
    </div>

    <div id="menu-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">Menu</div>
            <button class="modal-button" onclick="saveGame()">💾 Sauvegarder</button>
            <button class="modal-button" onclick="loadGame()">📂 Charger</button>
            <button class="modal-button danger" onclick="resetGame()">🔄 Recommencer</button>
            <button class="modal-button" onclick="closeMenu()">Annuler</button>
        </div>
    </div>

    <script>
        // État du jeu
        let gameState = {
            currentNode: 'start',
            history: [],
            day: 1,
            playerName: 'Parent',
            branch: null, // 'siege', 'ville', 'exode'
            flags: {} // Flags pour conditions spéciales
        };

        // Système de messages
        function addMessage(text, type = 'received', delay = 0) {
            return new Promise(resolve => {
                setTimeout(() => {
                    const messagesDiv = document.getElementById('messages');
                    const messageDiv = document.createElement('div');
                    messageDiv.className = `message ${type}`;

                    const bubble = document.createElement('div');
                    bubble.className = 'message-bubble';
                    bubble.innerHTML = text;

                    messageDiv.appendChild(bubble);
                    messagesDiv.appendChild(messageDiv);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;

                    resolve();
                }, delay);
            });
        }

        function showTyping() {
            document.getElementById('typing').classList.add('active');
        }

        function hideTyping() {
            document.getElementById('typing').classList.remove('active');
        }

        function showChoices(choices) {
            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';

            choices.forEach(choice => {
                const button = document.createElement('button');
                button.className = 'choice-button';
                button.textContent = choice.text;
                button.onclick = () => selectChoice(choice);
                choicesDiv.appendChild(button);
            });

            choicesDiv.classList.add('active');
        }

        function hideChoices() {
            document.getElementById('choices').classList.remove('active');
        }

        async function selectChoice(choice) {
            hideChoices();

            // Ajouter le choix comme message envoyé
            await addMessage(choice.text, 'sent');

            // Enregistrer dans l'historique
            gameState.history.push({
                node: gameState.currentNode,
                choice: choice.text
            });

            // Exécuter l'action
            if (choice.action) {
                choice.action();
            }

            // Aller au prochain nœud
            if (choice.next) {
                gameState.currentNode = choice.next;
                await playNode(choice.next);
            }
        }

        // Arbre narratif
        const storyNodes = {
            start: {
                messages: [
                    { text: "Papa ? Maman ?", delay: 1000 },
                    { text: "C'est moi... Léo.", delay: 2000 },
                    { text: "Le téléphone normal marche pas. Y'a plus rien qui marche.", delay: 3500 },
                    { text: "Tante Claire est partie chercher des choses il y a 2 heures...", delay: 5000 },
                    { text: "Elle est pas revenue.", delay: 6500 }
                ],
                choices: [
                    {
                        text: "Léo, écoute-moi bien. Où es-tu exactement ?",
                        next: 'situation'
                    }
                ]
            },

            situation: {
                messages: [
                    { text: "Je... je suis chez Tante Claire. Dans sa maison.", delay: 1000 },
                    { text: "J'ai fermé toutes les portes comme tu m'as appris.", delay: 2500 },
                    { text: "Mais...", delay: 3500 },
                    { text: "Y'a des bruits dehors.", delay: 4500 },
                    { text: "Des gens qui crient. Et... et des vitres qui cassent.", delay: 6000 }
                ],
                choices: [
                    {
                        text: "Reste calme. Tu es en sécurité à l'intérieur ?",
                        next: 'secure_check'
                    }
                ]
            },

            secure_check: {
                messages: [
                    { text: "Je crois oui...", delay: 1000 },
                    { text: "J'ai mis le meuble devant la porte d'entrée.", delay: 2500 },
                    { text: "Papa/Maman... c'est quoi ce qui se passe ?", delay: 4000 },
                    { text: "Pourquoi tout le monde devient méchant ?", delay: 5500 }
                ],
                choices: [
                    {
                        text: "Il y a eu une panne générale. Les gens ont peur.",
                        next: 'explain_1'
                    },
                    {
                        text: "Je ne sais pas encore. Mais je vais te protéger.",
                        next: 'explain_1'
                    }
                ]
            },

            explain_1: {
                messages: [
                    { text: "...", delay: 1000 },
                    { text: "Attends !", delay: 2000 },
                    { text: "Y'a quelqu'un chez les voisins. J'entends des choses qui cassent.", delay: 3000 },
                    { text: "Ils sont en train de... de voler des trucs je crois.", delay: 5000 },
                    { text: "Papa/Maman... j'ai peur.", delay: 6500 }
                ],
                choices: [
                    {
                        text: "Cache-toi. Ne fais AUCUN bruit. Où peux-tu te cacher ?",
                        next: 'hide_now'
                    }
                ]
            },

            hide_now: {
                messages: [
                    { text: "Je... je vais dans le placard de la chambre.", delay: 1000 },
                    { text: "...", delay: 3000 },
                    { text: "...", delay: 6000 },
                    { text: "Ça va. Ils sont partis.", delay: 9000 },
                    { text: "Papa/Maman... quand est-ce que tu rentres ?", delay: 11000 }
                ],
                choices: [
                    {
                        text: "Je... on ne peut pas rentrer pour l'instant.",
                        next: 'hard_truth'
                    }
                ]
            },

            hard_truth: {
                messages: [
                    { text: "Comment ça ?", delay: 1000 },
                    { text: "Mais... mais je suis tout seul !", delay: 2500 },
                    { text: "Tu dois rentrer ! S'il te plaît !", delay: 4000 }
                ],
                choices: [
                    {
                        text: "Léo, écoute-moi. Tous les avions sont bloqués. Je ne peux pas.",
                        next: 'acceptance'
                    },
                    {
                        text: "Je ferais TOUT pour être là. Mais c'est impossible maintenant.",
                        next: 'acceptance'
                    }
                ]
            },

            acceptance: {
                messages: [
                    { text: "...", delay: 1000 },
                    { text: "Mais... mais je fais quoi alors ?", delay: 3000 },
                    { text: "Je peux pas rester tout seul ici...", delay: 5000 }
                ],
                choices: [
                    {
                        text: "Tu n'es pas seul. Je suis là, par téléphone. On va s'en sortir.",
                        next: 'strategy_choice'
                    }
                ]
            },

            strategy_choice: {
                messages: [
                    { text: "D'accord...", delay: 1000 },
                    { text: "Qu'est-ce que je dois faire ?", delay: 2500 },
                    { text: "Dis-moi quoi faire et je le ferai.", delay: 4000 }
                ],
                choices: [
                    {
                        text: "🏠 Reste dans la maison. Barricade-toi et attends que ça se calme.",
                        next: 'branch_siege',
                        action: () => { gameState.branch = 'siege'; }
                    },
                    {
                        text: "🔍 Va chercher Tante Claire. Elle a besoin de toi.",
                        next: 'branch_ville',
                        action: () => { gameState.branch = 'ville'; }
                    },
                    {
                        text: "🏔️ Rejoins notre maison de campagne. Tu te souviens du chemin ?",
                        next: 'branch_exode',
                        action: () => { gameState.branch = 'exode'; }
                    }
                ]
            },

            // BRANCHE 1: LE SIÈGE
            branch_siege: {
                messages: [
                    { text: "Rester ici... d'accord.", delay: 1000 },
                    { text: "Je vais vérifier les fenêtres.", delay: 2500 },
                    { text: "Il reste des conserves dans le placard. Et de l'eau.", delay: 4000 },
                    { text: "Je vais tenir le plus longtemps possible.", delay: 5500 },
                    { text: "...", delay: 7000 },
                    { text: "Papa/Maman ?", delay: 8500 },
                    { text: "Quelqu'un frappe à la porte.", delay: 10000 }
                ],
                choices: [
                    {
                        text: "Ne réponds pas. Reste silencieux.",
                        next: 'siege_knock_ignore'
                    },
                    {
                        text: "Demande qui c'est, mais n'ouvre PAS.",
                        next: 'siege_knock_ask'
                    }
                ]
            },

            siege_knock_ignore: {
                messages: [
                    { text: "...", delay: 1000 },
                    { text: "Il frappe encore.", delay: 3000 },
                    { text: '"S\'il vous plaît... c\'est M. Bernard. Votre voisin."', delay: 5000 },
                    { text: '"J\'ai besoin d\'aide..."', delay: 7000 },
                    { text: "Papa/Maman, c'est vraiment le voisin. Je reconnais sa voix.", delay: 9000 }
                ],
                choices: [
                    {
                        text: "Ouvre-lui. Mais sois prudent.",
                        next: 'siege_bernard_open',
                        action: () => { gameState.flags.bernardInside = true; }
                    },
                    {
                        text: "Non. C'est trop dangereux. Ne bouge pas.",
                        next: 'siege_bernard_ignore'
                    }
                ]
            },

            siege_knock_ask: {
                messages: [
                    { text: '"Qui... qui est là ?"', delay: 1000 },
                    { text: '"C\'est M. Bernard, ton voisin. S\'il te plaît, ouvre..."', delay: 2500 },
                    { text: 'Il a l\'air vraiment mal en point.', delay: 4500 }
                ],
                choices: [
                    {
                        text: "Ouvre-lui.",
                        next: 'siege_bernard_open',
                        action: () => { gameState.flags.bernardInside = true; }
                    },
                    {
                        text: "Dis-lui que tu ne peux pas. C'est trop risqué.",
                        next: 'siege_bernard_refuse'
                    }
                ]
            },

            siege_bernard_open: {
                messages: [
                    { text: "Je... j'ouvre.", delay: 1000 },
                    { text: "...", delay: 2500 },
                    { text: "C'est bon, il est entré. Je referme.", delay: 4000 },
                    { text: "Il a l'air très faible. Il tremble.", delay: 5500 },
                    { text: '"Merci mon petit... Merci..."', delay: 7000 },
                    { text: 'Papa/Maman, il dit qu\'il est diabétique.', delay: 9000 },
                    { text: 'Son insuline est chez lui mais... il peut plus y retourner.', delay: 11000 },
                    { text: 'Les pilleurs ont défoncé sa porte.', delay: 13000 }
                ],
                choices: [
                    {
                        text: "Il va falloir aller chercher son insuline. C'est vital.",
                        next: 'siege_insulin_mission'
                    },
                    {
                        text: "Qu'il se repose. On verra demain si ça se calme.",
                        next: 'siege_insulin_wait'
                    },
                    {
                        text: "Installe-le confortablement. Rationne l'eau et la nourriture.",
                        next: 'siege_bernard_settle'
                    }
                ]
            },

            siege_bernard_ignore: {
                messages: [
                    { text: "D'accord... je bouge pas.", delay: 1000 },
                    { text: "...", delay: 3000 },
                    { text: "Il arrête pas de frapper...", delay: 5000 },
                    { text: '"S\'il vous plaît... j\'ai besoin de mon insuline..."', delay: 7000 },
                    { text: "...", delay: 9000 },
                    { text: "Il est parti.", delay: 11000 },
                    { text: "...", delay: 13000 },
                    { text: "Papa/Maman... j'entends quelqu'un crier dehors.", delay: 15000 },
                    { text: "C'est... c'est la voix de M. Bernard.", delay: 17000 },
                    { text: "Et puis plus rien.", delay: 19000 }
                ],
                choices: [
                    {
                        text: "Tu as fait ce qu'il fallait. Ta sécurité d'abord.",
                        next: 'siege_night_1',
                        action: () => { gameState.flags.bernardDead = true; gameState.flags.guilt = true; }
                    }
                ]
            },

            siege_bernard_refuse: {
                messages: [
                    { text: '"Monsieur Bernard... je peux pas ouvrir. Désolé."', delay: 1000 },
                    { text: '"Je comprends, petit... Reste en sécurité."', delay: 3000 },
                    { text: "Il s'en va.", delay: 5000 },
                    { text: "...", delay: 7000 },
                    { text: "J'espère qu'il va s'en sortir.", delay: 9000 }
                ],
                choices: [
                    {
                        text: "Tu as fait le bon choix. Maintenant, prépare-toi pour la nuit.",
                        next: 'siege_night_1',
                        action: () => { gameState.flags.bernardRefused = true; }
                    }
                ]
            },

            siege_night_1: {
                messages: [
                    { text: "La nuit tombe.", delay: 1000 },
                    { text: "J'ai éteint toutes les lumières.", delay: 2500 },
                    { text: "Y'a des feux dehors. Des voitures qui brûlent.", delay: 4500 },
                    { text: "Papa/Maman... j'arrive pas à dormir.", delay: 6500 }
                ],
                choices: [
                    {
                        text: "Je reste en ligne avec toi. Tu n'es pas seul.",
                        next: 'siege_day_2'
                    },
                    {
                        text: "Économise la batterie. On se parle demain matin.",
                        next: 'siege_day_2',
                        action: () => { gameState.flags.batterySaved = true; }
                    }
                ]
            },

            siege_day_2: {
                messages: [
                    { text: "Papa/Maman ?", delay: 1000 },
                    { text: "C'est le matin. Jour 2.", delay: 2500 },
                    { text: "Les conserves commencent à diminuer.", delay: 4000 },
                    { text: "Si ça dure longtemps... je vais devoir sortir chercher à manger.", delay: 6000 }
                ],
                choices: [
                    {
                        text: "Rationne tout ce que tu as. 2 repas par jour maximum.",
                        next: 'siege_ration'
                    },
                    {
                        text: "On va planifier une sortie. Repère les maisons les plus sûres.",
                        next: 'siege_recon'
                    }
                ]
            },

            // BRANCHE 2: LA VILLE
            branch_ville: {
                messages: [
                    { text: "Chercher Tante Claire... oui, tu as raison.", delay: 1000 },
                    { text: "Je peux pas la laisser toute seule dehors.", delay: 2500 },
                    { text: "Je prends mon sac à dos. Et le téléphone.", delay: 4000 },
                    { text: "Elle allait au supermarché normalement.", delay: 5500 },
                    { text: "C'est à 20 minutes à pied.", delay: 7000 },
                    { text: "J'y vais.", delay: 8500 }
                ],
                choices: [
                    {
                        text: "Reste sur les petites rues. Évite les grandes avenues.",
                        next: 'ville_small_streets',
                        action: () => { gameState.flags.routeChoice = 'safe'; }
                    },
                    {
                        text: "Prends le chemin le plus rapide. Mais sois très prudent.",
                        next: 'ville_main_road',
                        action: () => { gameState.flags.routeChoice = 'fast'; }
                    }
                ]
            },

            ville_small_streets: {
                messages: [
                    { text: "Je passe par les petites rues.", delay: 1000 },
                    { text: "C'est calme ici... presque trop calme.", delay: 3000 },
                    { text: "Toutes les voitures sont abandonnées.", delay: 5000 },
                    { text: "Y'a des alarmes qui sonnent partout.", delay: 7000 },
                    { text: "Attends... je vois quelque chose.", delay: 9000 },
                    { text: "La voiture de Tante Claire ! Elle est garée devant la pharmacie !", delay: 11000 }
                ],
                choices: [
                    {
                        text: "Entre dans la pharmacie. Elle est peut-être là.",
                        next: 'ville_pharmacy_enter'
                    },
                    {
                        text: "Appelle-la d'abord. Ne prends pas de risques inutiles.",
                        next: 'ville_pharmacy_call'
                    }
                ]
            },

            ville_main_road: {
                messages: [
                    { text: "Je prends la grande avenue.", delay: 1000 },
                    { text: "...", delay: 2500 },
                    { text: "Oh non...", delay: 4000 },
                    { text: "Papa/Maman, c'est... c'est le chaos total.", delay: 5500 },
                    { text: "Y'a des gens qui pillent les magasins.", delay: 7500 },
                    { text: "Des voitures en feu.", delay: 9000 },
                    { text: "Je vois des silhouettes qui courent.", delay: 10500 }
                ],
                choices: [
                    {
                        text: "CACHE-TOI ! Maintenant !",
                        next: 'ville_hide_quick'
                    },
                    {
                        text: "Cours ! Retourne dans les petites rues !",
                        next: 'ville_retreat'
                    }
                ]
            },

            // BRANCHE 3: L'EXODE
            branch_exode: {
                messages: [
                    { text: "La maison de campagne... oui ! Je me souviens !", delay: 1000 },
                    { text: "On y allait tous les étés.", delay: 2500 },
                    { text: "C'est loin... mais y'a le bunker là-bas.", delay: 4000 },
                    { text: "Tu m'avais montré où était la clé.", delay: 5500 },
                    { text: "Je prends des affaires. Des vêtements, de la nourriture...", delay: 7500 },
                    { text: "Le chemin fait... 50 kilomètres je crois ?", delay: 9500 }
                ],
                choices: [
                    {
                        text: "Prends l'autoroute. C'est le plus direct.",
                        next: 'exode_highway',
                        action: () => { gameState.flags.exodeRoute = 'highway'; }
                    },
                    {
                        text: "Coupe par la forêt. C'est plus long mais plus sûr.",
                        next: 'exode_forest',
                        action: () => { gameState.flags.exodeRoute = 'forest'; }
                    }
                ]
            },

            exode_highway: {
                messages: [
                    { text: "Je prends l'autoroute.", delay: 1000 },
                    { text: "Mon vélo est dans le garage.", delay: 2500 },
                    { text: "En pédalant fort, je peux faire 15-20 km par jour.", delay: 4500 },
                    { text: "J'arrive sur l'autoroute...", delay: 6500 },
                    { text: "Papa/Maman, c'est incroyable.", delay: 8500 },
                    { text: "Y'a des MILLIERS de voitures abandonnées.", delay: 10500 },
                    { text: "C'est comme dans les films de zombies.", delay: 12500 }
                ],
                choices: [
                    {
                        text: "Fouille quelques voitures. Tu trouveras peut-être des provisions.",
                        next: 'exode_loot_cars'
                    },
                    {
                        text: "N'y touche pas. Continue à avancer.",
                        next: 'exode_keep_moving'
                    }
                ]
            },

            exode_forest: {
                messages: [
                    { text: "Je vais passer par la forêt.", delay: 1000 },
                    { text: "Y'a un sentier que tu m'avais montré une fois.", delay: 2500 },
                    { text: "Ça sera plus long mais... moins de gens.", delay: 4500 },
                    { text: "Je rentre dans la forêt.", delay: 6500 },
                    { text: "C'est bizarre... c'est tellement silencieux ici.", delay: 8500 },
                    { text: "On dirait que le monde extérieur existe plus.", delay: 10500 }
                ],
                choices: [
                    {
                        text: "C'est bien. Profite du calme et avance régulièrement.",
                        next: 'exode_forest_walk'
                    },
                    {
                        text: "Reste vigilant. La nature peut être dangereuse aussi.",
                        next: 'exode_forest_careful'
                    }
                ]
            },

            // Fins temporaires (à développer)
            ending_placeholder: {
                messages: [
                    { text: "...", delay: 1000 },
                    { text: "Papa/Maman ?", delay: 2500 },
                    { text: "Je crois que je vais y arriver.", delay: 4000 },
                    { text: "Merci d'être là.", delay: 5500 },
                    { text: "[À SUIVRE...]", delay: 7000 }
                ],
                choices: [
                    {
                        text: "Revenir au menu",
                        action: () => { openMenu(); }
                    }
                ]
            }
        };

        // Jouer un nœud narratif
        async function playNode(nodeId) {
            const node = storyNodes[nodeId];
            if (!node) {
                console.error('Nœud introuvable:', nodeId);
                return;
            }

            // Afficher le typing indicator
            showTyping();

            // Afficher les messages avec délais
            for (let i = 0; i < node.messages.length; i++) {
                const msg = node.messages[i];
                await new Promise(resolve => setTimeout(resolve, msg.delay));
                hideTyping();
                await addMessage(msg.text, 'received');
                if (i < node.messages.length - 1) {
                    showTyping();
                }
            }

            hideTyping();

            // Afficher les choix
            if (node.choices && node.choices.length > 0) {
                showChoices(node.choices);
            }
        }

        // Sauvegarder
        function saveGame() {
            try {
                localStorage.setItem('transmission_save', JSON.stringify(gameState));
                alert('✅ Partie sauvegardée !');
                closeMenu();
            } catch (e) {
                alert('❌ Erreur lors de la sauvegarde.');
            }
        }

        // Charger
        function loadGame() {
            try {
                const saved = localStorage.getItem('transmission_save');
                if (saved) {
                    if (confirm('Charger la partie sauvegardée ?')) {
                        location.reload();
                    }
                } else {
                    alert('❌ Aucune sauvegarde trouvée.');
                }
            } catch (e) {
                alert('❌ Erreur lors du chargement.');
            }
        }

        // Recommencer
        function resetGame() {
            if (confirm('⚠️ Recommencer ? Toute progression sera perdue.')) {
                localStorage.removeItem('transmission_save');
                location.reload();
            }
        }

        // Menu
        function openMenu() {
            document.getElementById('menu-modal').classList.add('active');
        }

        function closeMenu() {
            document.getElementById('menu-modal').classList.remove('active');
        }

        // Démarrer le jeu
        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');

            // Vérifier s'il y a une sauvegarde
            const saved = localStorage.getItem('transmission_save');
            if (saved) {
                gameState = JSON.parse(saved);
                // Reconstruire les messages de l'historique
                gameState.history.forEach(h => {
                    // On pourrait reconstruire l'historique ici si nécessaire
                });
                playNode(gameState.currentNode);
            } else {
                playNode('start');
            }
        }

        // Auto-save périodique
        setInterval(() => {
            if (gameState.currentNode !== 'start') {
                localStorage.setItem('transmission_save', JSON.stringify(gameState));
            }
        }, 30000); // Toutes les 30 secondes
    </script>
</body>
</html>
